<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Règles de sécurité : seuls les fichiers de Musala peuvent s'exécuter (Vercel ajoute les mêmes, voir vercel.json). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Musala · Le réseau pro de la RDC</title>
  <meta name="description" content="Musala connecte les demandeurs d'emploi et les employeurs en République démocratique du Congo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23007fff'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>M</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#007fff">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="logo"><span class="logo-mark">M</span>usala</a>
      <nav class="nav" id="nav">
        <a href="#/offres" id="lienOffres">Offres</a>
        <a href="#/talents" id="lienTalents">Talents</a>
        <span id="navUser"></span>
      </nav>
      <div class="reglages">
        <select id="choixLangue" aria-label="Langue"></select>
        <button class="bouton-leger" id="boutonLeger" aria-pressed="false" title="Mode léger">📶</button>
        <button class="menu-btn" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
      </div>
    </div>
  </header>

  <div id="bandeauLangue" class="bandeau-langue" hidden></div>

  <main id="app" class="container">
    <div class="loading">Chargement de Musala…</div>
  </main>

  <footer class="footer">
    <div class="container">
      <strong>Musala</strong> · <span id="piedSlogan">« le travail » en lingala · Le réseau pro de la RDC</span> 🇨🇩
      <br><small id="piedProjet">Projet d'Arnold · Code en Famille</small>
      <p id="compteurDonnees" class="compteur" hidden></p>
      <p><button class="btn btn-petit btn-blanc" id="boutonInstaller" hidden>📲 Installer Musala</button></p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>

  <script src="vendor/sql-wasm.js"></script>
  <script src="js/db.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/otp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
